services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-xool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans .env}
      POSTGRES_DB: ${DB_NAME:-xool}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xool}"]
      interval: 5s
      retries: 10

  # Décommenter à partir de la tâche correspondante
  # api:
  #   build: ./api
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports: ["8000:8000"]

  # web:
  #   build: ./web
  #   env_file: .env
  #   depends_on: [api]
  #   ports: ["3000:3000"]

volumes:
  dbdata:
